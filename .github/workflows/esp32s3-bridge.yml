name: esp32s3-bridge
on:
  pull_request:
    paths: ["firmware/esp32s3-bridge/**", ".github/workflows/esp32s3-bridge.yml"]
  push:
    branches: [main]
    paths: ["firmware/esp32s3-bridge/**", ".github/workflows/esp32s3-bridge.yml"]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C firmware/esp32s3-bridge/components/omi_proto/test
  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.2
    steps:
      - uses: actions/checkout@v4
      - name: idf.py build (esp32s3, defaults)
        shell: bash
        working-directory: firmware/esp32s3-bridge
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build
          sha256sum build/omi_s3_bridge.bin
      - uses: actions/upload-artifact@v4
        with:
          name: omi-s3-bridge
          path: |
            firmware/esp32s3-bridge/build/omi_s3_bridge.bin
            firmware/esp32s3-bridge/build/bootloader/bootloader.bin
            firmware/esp32s3-bridge/build/partition_table/partition-table.bin
            firmware/esp32s3-bridge/build/flasher_args.json
