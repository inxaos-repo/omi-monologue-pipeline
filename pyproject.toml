[project]
name = "omi-monologue-pipeline"
version = "0.1.0"
description = "Solo monologue audio -> transcript -> summary/action items -> Wiki.js + Todoist"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2026.6",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0"]
ble = ["bleak>=0.22"]
watch = ["watchdog>=4"]

[project.scripts]
omi-pipeline = "omi_pipeline.cli:main"
omi-receiver = "omi_pipeline.receiver:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omi_pipeline"]
